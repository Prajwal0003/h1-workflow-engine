name: Bug Bounty Scan

on:
  schedule:
    - cron: '0 */5 * * *' # Run every 5 hours automatically
  workflow_dispatch: # Allow manual triggering from the GitHub Actions tab

jobs:
  recon-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Go, Git, Curl)
        run: sudo apt-get update && sudo apt-get install -y golang git wget curl

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Create .env from Secrets
        run: |
          cat <<EOF > .env
          HACKERONE_USERNAME=${{ secrets.HACKERONE_USERNAME }}
          HACKERONE_API_TOKEN=${{ secrets.HACKERONE_API_TOKEN }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          SHODAN_API_KEY=${{ secrets.SHODAN_API_KEY }}
          NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          INTERACTSH_URL=${{ secrets.INTERACTSH_URL }}
          EOF

      - name: Execute Cross-Platform Setup (Downloads Nuclei, FFUF, Subfinder, GAU)
        run: python setup_tools.py

      - name: Run Autopilot Engine (Dynamic Targets)
        run: python autopilot.py --dynamic
        timeout-minutes: 45

      - name: Generate HTML Dashboard Report
        if: always()
        run: python generate_report.py

      - name: Upload Vulnerability Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-bounty-results
          path: |
            data/autopilot/
            reports/
