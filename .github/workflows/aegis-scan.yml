name: Aegis-Auto Scheduled Scan

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

jobs:
  scan:
    if: vars.ENABLE_LIVE_SCANS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Aegis-Auto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          FREELLMAPI_URL: ${{ secrets.FREELLMAPI_URL }}
          FREELLMAPI_KEY: ${{ secrets.FREELLMAPI_KEY }}
        run: |
          python -m modules.tool_updater
          python -m modules.zero_day_watcher
          python autopilot.py --dynamic
