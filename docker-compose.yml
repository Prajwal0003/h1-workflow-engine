version: '3.8'

services:
  autopilot:
    build: .
    command: ["python", "run_24_7.py"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - neo4j
      - freellmapi

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/freellmapi:/app/server/data
    environment:
      - ENCRYPTION_KEY=${FREELLMAPI_ENCRYPTION_KEY:?Set FREELLMAPI_ENCRYPTION_KEY}
      - PORT=3001
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    volumes:
      - ./data/neo4j:/data

  config-ui:
    build: .
    profiles: ["config"]
    command: ["python", "config_app.py"]
    environment:
      H1_CONFIG_BIND: 0.0.0.0
      H1_CONFIG_TOKEN: ${H1_CONFIG_TOKEN:-}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./:/app


  bot:
    build: .
    command: ["python", "c2_bot.py"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - autopilot
